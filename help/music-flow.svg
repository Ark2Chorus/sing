<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 356" role="img" aria-labelledby="t d">
  <title id="t">How your music gets into the app</title>
  <desc id="d">You send your music to Ark2, Ark2 encodes it, uploads it to your Online Drive, and it shows in the app.</desc>
  <style>
    .box{ fill:#1a1f28; stroke:#3a4150; stroke-width:1.2; }
    .num{ fill:#c9a15a; }
    .n{ font:700 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill:#1a1406; text-anchor:middle; }
    .h{ font:700 13.5px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill:#f0ede4; }
    .s{ font:12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill:#9aa0aa; }
    .ar{ stroke:#c9a15a; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .ic{ fill:none; stroke:#e3c98a; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <!-- 1. You send it -->
  <rect class="box" x="8" y="6" width="304" height="62" rx="12"/>
  <circle class="num" cx="34" cy="37" r="13"/><text class="n" x="34" y="42">1</text>
  <text class="h" x="58" y="32">You send your music</text>
  <text class="s" x="58" y="50">Sheet music: PDF or photo</text>
  <g class="ic" transform="translate(276 25)"><path d="M3 1h10l5 5v18H3z"/><path d="M13 1v5h5M7 12h7M7 16h7M7 20h4"/></g>

  <path class="ar" d="M160 72v18M153 83l7 7 7-7"/>

  <!-- 2. Ark2 encodes it -->
  <rect class="box" x="8" y="96" width="304" height="62" rx="12"/>
  <circle class="num" cx="34" cy="127" r="13"/><text class="n" x="34" y="132">2</text>
  <text class="h" x="58" y="122">We (Ark2) encode it</text>
  <text class="s" x="58" y="140">Notes, voices and audio for the app</text>
  <g class="ic" transform="translate(274 113)"><path d="M8 6 2 13l6 7M18 6l6 7-6 7M15 3l-4 20"/></g>

  <path class="ar" d="M160 162v18M153 173l7 7 7-7"/>

  <!-- 3. Uploaded to your Online Drive -->
  <rect class="box" x="8" y="186" width="304" height="62" rx="12"/>
  <circle class="num" cx="34" cy="217" r="13"/><text class="n" x="34" y="222">3</text>
  <text class="h" x="58" y="212">Uploaded to your Online Drive</text>
  <text class="s" x="58" y="230">Into the folders made for your choir</text>
  <g class="ic" transform="translate(272 204)"><path d="M7 21h15a5 5 0 0 0 .5-10A7 7 0 0 0 9 9.5 5.5 5.5 0 0 0 7 21z"/><path d="M15 18v-7M12 14l3-3 3 3"/></g>

  <path class="ar" d="M160 252v18M153 263l7 7 7-7"/>

  <!-- 4. In the app -->
  <rect class="box" x="8" y="276" width="304" height="72" rx="12" style="stroke:#c9a15a"/>
  <circle class="num" cx="34" cy="312" r="13"/><text class="n" x="34" y="317">4</text>
  <text class="h" x="58" y="302">Open it in the app</text>
  <text class="s" x="58" y="320">Pick the folder under Online Drive,</text>
  <text class="s" x="58" y="336">tap ⬇ to keep it for offline use</text>
  <g class="ic" transform="translate(276 296)"><rect x="3" y="1" width="14" height="24" rx="3"/><path d="M8 21h4M10 7v8M7 12l3 3 3-3"/></g>
</svg>
